# Pubblica l'app su Firebase Hosting a ogni push su main.
#
# Il sito di destinazione sta in firebase.json ("site"). Il segreto
# FIREBASE_SERVICE_ACCOUNT (chiave JSON di un account di servizio del progetto
# magazzino-edile-pos) va creato una volta a mano in
# Settings > Secrets and variables > Actions: finche' manca, questo job fallisce
# senza toccare nulla.
name: Pubblica su Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: magazzino-edile-pos
